<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabla de Multiplicar Interactiva</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    padding: 30px;
    max-width: 500px;
    width: 100%;
    text-align: center;
  }
  h1 { color: #4a3b78; font-size: 24px; margin-bottom: 10px; }
  .config { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  select, button {
    padding: 10px 16px;
    border-radius: 10px;
    border: 2px solid #764ba2;
    font-size: 15px;
    cursor: pointer;
    background: white;
  }
  .start-btn { background: #764ba2; color: white; font-weight: bold; }
  .start-btn:hover { background: #5f3a8a; }
  .stats { display: flex; justify-content: space-around; margin-bottom: 15px; font-size: 14px; color: #555; }
  .stats span { font-weight: bold; color: #4a3b78; }
  .question-box { background: #f4f1fb; border-radius: 15px; padding: 30px; margin: 15px 0; }
  .question { font-size: 42px; font-weight: bold; color: #333; margin-bottom: 20px; }
  input[type="number"] {
    font-size: 28px;
    text-align: center;
    width: 120px;
    padding: 10px;
    border-radius: 10px;
    border: 3px solid #764ba2;
    outline: none;
  }
  input[type="number"]:focus {
    border-color: #4a3b78;
    box-shadow: 0 0 0 3px rgba(118,75,162,0.2);
  }
  .feedback { margin-top: 15px; font-size: 20px; font-weight: bold; min-height: 30px; }
  .correct { color: #2e7d32; }
  .incorrect { color: #c62828; }
  .progress-bar { width: 100%; height: 10px; background: #eee; border-radius: 5px; overflow: hidden; margin-bottom: 15px; }
  .progress-fill { height: 100%; background: #764ba2; transition: width 0.3s ease; width: 0%; }
  .hidden { display: none; }
  .final-score { font-size: 22px; margin: 15px 0; color: #4a3b78; font-weight: bold; }
  .btn-row { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
  #next-btn { background: #4a3b78; color: white; font-weight: bold; display: none; }
</style>
</head>
<body>

<div class="card">
  <h1>🧮 Tabla de Multiplicar Interactiva</h1>

  <div id="setup-screen">
    <p style="color:#555; margin-bottom: 15px;">Elige la tabla y la cantidad de preguntas</p>
    <div class="config">
      <select id="table-select">
        <option value="0">Tablas mezcladas (2-10)</option>
        <option value="2">Tabla del 2</option>
        <option value="3">Tabla del 3</option>
        <option value="4">Tabla del 4</option>
        <option value="5">Tabla del 5</option>
        <option value="6">Tabla del 6</option>
        <option value="7">Tabla del 7</option>
        <option value="8">Tabla del 8</option>
        <option value="9">Tabla del 9</option>
        <option value="10">Tabla del 10</option>
        <option value="11">Tabla del 11</option>
        <option value="12">Tabla del 12</option>
      </select>
      <select id="count-select">
        <option value="5">5 preguntas</option>
        <option value="10" selected>10 preguntas</option>
        <option value="15">15 preguntas</option>
        <option value="20">20 preguntas</option>
      </select>
    </div>
    <button class="start-btn" onclick="startQuiz()">Empezar</button>
  </div>

  <div id="quiz-screen" class="hidden">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="stats">
      <div>Pregunta <span id="current-q">1</span>/<span id="total-q">10</span></div>
      <div>Aciertos: <span id="score">0</span></div>
    </div>
    <div class="question-box">
      <div class="question" id="question-text">? x ? = ?</div>
      <input type="number" id="answer-input" placeholder="?" autocomplete="off">
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="btn-row">
      <button class="start-btn" id="check-btn" onclick="checkAnswer()">Comprobar</button>
      <button id="next-btn" onclick="nextQuestion()">Siguiente →</button>
    </div>
  </div>

  <div id="result-screen" class="hidden">
    <div id="result-emoji" style="font-size: 60px;"></div>
    <div class="final-score" id="final-score"></div>
    <p id="result-message" style="color:#555;"></p>
    <button class="start-btn" onclick="resetQuiz()">Intentar de nuevo</button>
  </div>
</div>

<script>
let questions = [];
let currentIndex = 0;
let score = 0;
let answered = false;

function generateQuestions(table, count) {
  const qs = [];
  for (let i = 0; i < count; i++) {
    let a, b;
    if (table === 0) {
      a = Math.floor(Math.random() * 9) + 2;
    } else {
      a = table;
    }
    b = Math.floor(Math.random() * 10) + 1;
    qs.push({ a, b, answer: a * b });
  }
  return qs;
}

function startQuiz() {
  const table = parseInt(document.getElementById('table-select').value);
  const count = parseInt(document.getElementById('count-select').value);

  questions = generateQuestions(table, count);
  currentIndex = 0;
  score = 0;

  document.getElementById('setup-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.remove('hidden');
  document.getElementById('total-q').textContent = count;

  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = questions[currentIndex];
  document.getElementById('question-text').textContent = `${q.a} x ${q.b} = ?`;
  document.getElementById('current-q').textContent = currentIndex + 1;
  document.getElementById('score').textContent = score;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('answer-input').value = '';
  document.getElementById('answer-input').disabled = false;
  document.getElementById('answer-input').focus();
  document.getElementById('check-btn').style.display = 'inline-block';
  document.getElementById('next-btn').style.display = 'none';

  const progress = (currentIndex / questions.length) * 100;
  document.getElementById('progress-fill').style.width = progress + '%';
}

function checkAnswer() {
  if (answered) return;
  const input = document.getElementById('answer-input');
  const val = input.value.trim();

  if (val === '') {
    document.getElementById('feedback').textContent = 'Escribe un número primero';
    document.getElementById('feedback').className = 'feedback incorrect';
    return;
  }

  answered = true;
  const q = questions[currentIndex];
  const userAnswer = parseInt(val);
  const feedback = document.getElementById('feedback');

  if (userAnswer === q.answer) {
    score++;
    feedback.textContent = '¡Correcto! 🎉';
    feedback.className = 'feedback correct';
  } else {
    feedback.textContent = `Incorrecto. La respuesta era ${q.answer}`;
    feedback.className = 'feedback incorrect';
  }

  document.getElementById('score').textContent = score;
  input.disabled = true;
  document.getElementById('check-btn').style.display = 'none';
  document.getElementById('next-btn').style.display = 'inline-block';
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < questions.length) {
    showQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');

  const percentage = Math.round((score / questions.length) * 100);
  document.getElementById('final-score').textContent = `${score} de ${questions.length} correctas (${percentage}%)`;

  let emoji, message;
  if (percentage === 100) {
    emoji = '🏆';
    message = '¡Perfecto! Dominas esta tabla.';
  } else if (percentage >= 80) {
    emoji = '⭐';
    message = '¡Muy bien! Casi perfecto.';
  } else if (percentage >= 50) {
    emoji = '👍';
    message = 'Buen intento, sigue practicando.';
  } else {
    emoji = '💪';
    message = 'No te rindas, la práctica hace al maestro.';
  }
  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-message').textContent = message;
}

function resetQuiz() {
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('setup-screen').classList.remove('hidden');
}

document.getElementById('answer-input').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    if (!answered) {
      checkAnswer();
    } else {
      nextQuestion();
    }
  }
});
</script>

</body>
</html>
